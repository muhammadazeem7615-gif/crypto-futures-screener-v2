<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monotonic Trend Consensus - Binance Futures Scanner</title>
    <style>
        :root {
            --bg-color: #0b0e11;
            --card-bg: #1e2329;
            --border-color: #2b313a;
            --text-main: #eaecef;
            --text-muted: #848e9c;
            --bullish-color: #0ecb81;
            --bearish-color: #f6465d;
            --neutral-color: #f0b90b;
            --accent-blue: #16b9e5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            font-size: 14px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.5rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }

        select, input, button {
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s ease;
        }

        select:focus, input:focus {
            border-color: var(--accent-blue);
        }

        button.btn-primary {
            background-color: var(--accent-blue);
            color: #000;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: auto;
        }

        button.btn-primary:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
            flex-wrap: wrap;
        }

        .stat-item span {
            color: var(--text-muted);
        }

        .stat-item strong {
            color: var(--text-main);
            margin-left: 5px;
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background-color: var(--bg-color);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--accent-blue);
            transition: width 0.2s ease;
        }

        .table-container {
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: rgba(255, 255, 255, 0.02);
            padding: 14px 16px;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.8rem;
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
            user-select: none;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .section-header td {
            background-color: rgba(22, 185, 229, 0.08);
            color: var(--accent-blue);
            font-weight: bold;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 10px 16px;
        }

        .tag {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.75rem;
        }

        .tag-bullish {
            background-color: rgba(14, 203, 129, 0.15);
            color: var(--bullish-color);
            border: 1px solid var(--bullish-color);
        }

        .tag-bearish {
            background-color: rgba(246, 70, 93, 0.15);
            color: var(--bearish-color);
            border: 1px solid var(--bearish-color);
        }

        .tag-zerocross {
            background-color: rgba(22, 185, 229, 0.15);
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
        }

        .recency-badge {
            font-weight: bold;
            color: var(--neutral-color);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Monotonic Trend Consensus - Binance Futures Scanner</h1>
        <div id="last-updated" style="color: var(--text-muted); font-size: 0.85rem;">Ready</div>
    </header>

    <div class="controls-grid">
        <div class="control-group">
            <label>Timeframe</label>
            <select id="timeframe">
                <option value="5m" selected>5 Minutes</option>
                <option value="15m">15 Minutes</option>
                <option value="30m">30 Minutes</option>
                <option value="1h">1 Hour</option>
                <option value="4h">4 Hours</option>
                <option value="1d">1 Day</option>
            </select>
        </div>

        <div class="control-group">
            <label>Preset Configuration</label>
            <select id="preset">
                <option value="Fast Response" selected>Fast Response (5,8,13,21 | 0.25 | 50%)</option>
                <option value="Default">Default (8,13,21,34 | 0.35 | 60%)</option>
                <option value="Smooth Trend">Smooth Trend (21,34,55,89 | 0.45 | 75%)</option>
            </select>
        </div>

        <div class="control-group">
            <label>Signal Filter</label>
            <select id="signal-filter">
                <option value="all_master" selected>All Signals (Master View)</option>
                <option value="trend_starts">Neutral ➔ Bull/Bear Starts</option>
                <option value="bullish_starts">Neutral ➔ Bullish Only</option>
                <option value="bearish_starts">Neutral ➔ Bearish Only</option>
                <option value="bear_to_zero">Bearish to Zero Cross (Upward)</option>
                <option value="bull_to_zero">Bullish to Zero Cross (Downward)</option>
            </select>
        </div>

        <div class="control-group">
            <label>Max Trend Age</label>
            <select id="max-trend-age">
                <option value="0">Current Bar Only (0)</option>
                <option value="1">Up to 1 Bar Ago</option>
                <option value="2" selected>Up to 2 Bars Ago</option>
            </select>
        </div>

        <div class="control-group">
            <label>Quick Symbol Search</label>
            <input type="text" id="symbol-search" placeholder="e.g. BTC, ETH, SOL..." oninput="renderTable()">
        </div>

        <button id="scan-btn" class="btn-primary" onclick="startScan()">Run Scanner</button>
    </div>

    <div class="progress-container">
        <div id="progress-bar" class="progress-bar"></div>
    </div>

    <div class="stats-bar">
        <div class="stat-item"><span>Total Evaluated:</span> <strong id="stat-total">0</strong></div>
        <div class="stat-item"><span>Passed Vol Filter (> $1M 24h):</span> <strong id="stat-passed-vol">0</strong></div>
        <div class="stat-item"><span>Qualifying Signals:</span> <strong id="stat-signals">0</strong></div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Symbol</th>
                    <th>Price (USDT)</th>
                    <th>24h Change</th>
                    <th>Signal</th>
                    <th>Started Ago</th>
                    <th>Conviction</th>
                </tr>
            </thead>
            <tbody id="results-body">
                <tr>
                    <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 30px;">
                        Click "Run Scanner" to fetch live Binance Futures data.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // --- EXACT Spearman Rank Logic (Untouched Core Math) ---
    function f_spearman(s, len) {
        if (s.length < len) return null;
        
        const windowPrices = [];
        const startIdx = s.length - 1;
        for (let i = 0; i < len; i++) {
            windowPrices.push(s[startIdx - i]);
        }

        let sumd2 = 0.0;
        for (let i = 0; i < len; i++) {
            const pi = windowPrices[i];
            let less = 0.0;
            let eq = 0.0;
            for (let j = 0; j < len; j++) {
                const pj = windowPrices[j];
                if (pj < pi) less += 1.0;
                else if (pj === pi) eq += 1.0;
            }
            const price_rank = less + (eq + 1.0) / 2.0;
            const time_rank = len - i;
            const d = price_rank - time_rank;
            sumd2 += d * d;
        }

        const denom = len * len * len - len;
        const rho = denom > 0 ? 1.0 - (6.0 * sumd2) / denom : 0.0;
        return Math.max(-1.0, Math.min(1.0, rho));
    }

    function getPresetSettings(presetName) {
        if (presetName === 'Smooth Trend') {
            return { windows: [21, 34, 55, 89], threshold: 0.45, min_conviction: 75 };
        } else if (presetName === 'Default') {
            return { windows: [8, 13, 21, 34], threshold: 0.35, min_conviction: 60 };
        }
        return { windows: [5, 8, 13, 21], threshold: 0.25, min_conviction: 50 };
    }

    function calculateIndicatorHistory(closes, settings) {
        const { windows, threshold, min_conviction } = settings;
        const maxLen = Math.max(...windows);
        const states = [];

        for (let b = maxLen; b < closes.length; b++) {
            const slice = closes.slice(0, b + 1);
            const rhos = [];

            for (let w of windows) {
                const rho = f_spearman(slice, w);
                if (rho !== null) rhos.push(rho);
            }

            if (rhos.length === 0) {
                states.push({ state: 0, consensus: 0, conviction: 0 });
                continue;
            }

            const consensus = rhos.reduce((a, b) => a + b, 0) / rhos.length;
            const sgn = consensus >= 0 ? 1 : -1;
            const agree = rhos.filter(v => (v >= 0 ? 1 : -1) === sgn).length;
            const conviction = (agree / rhos.length) * 100.0;

            const raw_bull = (consensus > threshold) && (conviction >= min_conviction);
            const raw_bear = (consensus < -threshold) && (conviction >= min_conviction);
            const state = raw_bull ? 1 : (raw_bear ? -1 : 0);

            states.push({
                state,
                consensus,
                conviction,
                barIndex: b
            });
        }
        return states;
    }

    function formatBarsAgo(barsAgo) {
        if (barsAgo === 0) return `<span class="recency-badge" style="color: #00ffaa;">CURRENT BAR (0)</span>`;
        return `<span class="recency-badge">${barsAgo} BAR${barsAgo > 1 ? 'S' : ''} AGO</span>`;
    }

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
    let isScanning = false;
    let globalResults = [];

    async function startScan() {
        if (isScanning) return;
        isScanning = true;

        const scanBtn = document.getElementById('scan-btn');
        scanBtn.disabled = true;
        scanBtn.innerText = "Scanning...";

        const timeframe = document.getElementById('timeframe').value;
        const preset = document.getElementById('preset').value;
        const signalFilter = document.getElementById('signal-filter').value;
        const maxTrendAge = parseInt(document.getElementById('max-trend-age').value, 10);
        const settings = getPresetSettings(preset);

        const baseUrl = 'https://fapi.binance.com';
        const tickerEndpoint = '/fapi/v1/ticker/24hr';
        const klineEndpoint = '/fapi/v1/klines';

        const tbody = document.getElementById('results-body');
        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 30px;">Fetching Binance Futures universe...</td></tr>`;

        try {
            const tickerRes = await fetch(baseUrl + tickerEndpoint);
            const tickers = await tickerRes.json();

            const usdtPairs = tickers.filter(t => 
                t.symbol.endsWith('USDT') && 
                parseFloat(t.quoteVolume) >= 1000000
            ).sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume));

            document.getElementById('stat-total').innerText = tickers.length;
            
            globalResults = [];
            let processed = 0;

            const BATCH_SIZE = 8;
            for (let i = 0; i < usdtPairs.length; i += BATCH_SIZE) {
                const batch = usdtPairs.slice(i, i + BATCH_SIZE);

                await Promise.all(batch.map(async (ticker) => {
                    try {
                        const symbol = ticker.symbol;
                        const priceChangePercent = parseFloat(ticker.priceChangePercent);
                        const klineRes = await fetch(`${baseUrl}${klineEndpoint}?symbol=${symbol}&interval=${timeframe}&limit=200`);
                        const klines = await klineRes.json();

                        if (!Array.isArray(klines) || klines.length < 50) return;

                        const closes = klines.map(k => parseFloat(k[4]));
                        const currentPrice = closes[closes.length - 1];

                        const history = calculateIndicatorHistory(closes, settings);
                        if (history.length < 2) return;

                        const latestState = history[history.length - 1];
                        const prevConsensus = history[history.length - 2].consensus;
                        const currConsensus = latestState.consensus;
                        
                        const isUpwardCross = prevConsensus < 0 && currConsensus >= 0;
                        const isDownwardCross = prevConsensus > 0 && currConsensus <= 0;

                        let isTrendStart = false;
                        let barsAgo = 0;
                        if (latestState.state !== 0) {
                            let startIndex = history.length - 1;
                            while (startIndex > 0 && history[startIndex - 1].state === latestState.state) {
                                startIndex--;
                            }
                            if (startIndex > 0 && history[startIndex - 1].state === 0) {
                                isTrendStart = true;
                                barsAgo = (history.length - 1) - startIndex;
                            }
                        }

                        let qualifies = false;
                        let transitionType = "";
                        let category = "";

                        if (signalFilter === 'all_master') {
                            if (isUpwardCross) {
                                qualifies = true;
                                transitionType = "Bearish ➔ Zero Cross (Up)";
                                category = "early";
                                barsAgo = 0;
                            } else if (isDownwardCross) {
                                qualifies = true;
                                transitionType = "Bullish ➔ Zero Cross (Down)";
                                category = "early";
                                barsAgo = 0;
                            } else if (isTrendStart && barsAgo <= maxTrendAge) {
                                qualifies = true;
                                transitionType = latestState.state === 1 ? "Neutral ➔ Bullish" : "Neutral ➔ Bearish";
                                category = "confirmed";
                            }
                        } else if (signalFilter === 'bear_to_zero') {
                            if (isUpwardCross) { qualifies = true; transitionType = "Bearish ➔ Zero Cross"; category = "early"; barsAgo = 0; }
                        } else if (signalFilter === 'bull_to_zero') {
                            if (isDownwardCross) { qualifies = true; transitionType = "Bullish ➔ Zero Cross"; category = "early"; barsAgo = 0; }
                        } else {
                            if (isTrendStart && barsAgo <= maxTrendAge) {
                                if (signalFilter === 'trend_starts') {
                                    qualifies = true;
                                    transitionType = latestState.state === 1 ? "Neutral ➔ Bullish" : "Neutral ➔ Bearish";
                                    category = "confirmed";
                                } else if (signalFilter === 'bullish_starts' && latestState.state === 1) {
                                    qualifies = true;
                                    transitionType = "Neutral ➔ Bullish";
                                    category = "confirmed";
                                } else if (signalFilter === 'bearish_starts' && latestState.state === -1) {
                                    qualifies = true;
                                    transitionType = "Neutral ➔ Bearish";
                                    category = "confirmed";
                                }
                            }
                        }

                        if (qualifies) {
                            globalResults.push({
                                symbol,
                                price: currentPrice,
                                priceChangePercent,
                                transitionType,
                                category,
                                barsAgo,
                                conviction: latestState.conviction
                            });
                        }
                    } catch (e) {
                        // Skip individual symbol error securely
                    }
                }));

                processed += batch.length;
                const progressPct = Math.min(100, (processed / usdtPairs.length) * 100);
                document.getElementById('progress-bar').style.width = progressPct + '%';
                document.getElementById('stat-passed-vol').innerText = usdtPairs.length;
                document.getElementById('stat-signals').innerText = globalResults.length;

                await sleep(60);
            }

            renderTable();
            document.getElementById('last-updated').innerText = `Updated: ${new Date().toLocaleTimeString()}`;

        } catch (err) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--bearish-color); padding: 30px;">Error fetching Binance Futures data. Check network connection.</td></tr>`;
        } finally {
            isScanning = false;
            scanBtn.disabled = false;
            scanBtn.innerText = "Run Scanner";
        }
    }

    function renderTable() {
        const tbody = document.getElementById('results-body');
        const searchTerm = document.getElementById('symbol-search').value.trim().toUpperCase();

        let filtered = globalResults.filter(r => r.symbol.includes(searchTerm));
        filtered.sort((a, b) => a.barsAgo - b.barsAgo);

        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 30px;">No Binance Futures matched your search or filter criteria.</td></tr>`;
            return;
        }

        // Separate into visual sections if Master View
        const earlyWarnings = filtered.filter(r => r.category === 'early');
        const confirmedTrends = filtered.filter(r => r.category === 'confirmed');

        let html = '';

        const buildRows = (items) => {
            return items.map(r => {
                let tagClass = 'tag-bearish';
                if (r.transitionType.includes('Bullish') || r.transitionType.includes('Up')) tagClass = 'tag-bullish';
                if (r.transitionType.includes('Zero Cross')) tagClass = 'tag-zerocross';
                if (r.transitionType.includes('Bearish')) tagClass = 'tag-bearish';

                const changeColor = r.priceChangePercent >= 0 ? 'var(--bullish-color)' : 'var(--bearish-color)';
                const changeSign = r.priceChangePercent >= 0 ? '+' : '';

                return `
                    <tr>
                        <td><strong>${r.symbol}</strong></td>
                        <td>$${r.price < 1 ? r.price.toFixed(6) : r.price.toFixed(2)}</td>
                        <td style="color: ${changeColor}; font-weight: 600;">${changeSign}${r.priceChangePercent.toFixed(2)}%</td>
                        <td><span class="tag ${tagClass}">${r.transitionType}</span></td>
                        <td>${formatBarsAgo(r.barsAgo)}</td>
                        <td>${r.conviction.toFixed(0)}%</td>
                    </tr>
                `;
            }).join('');
        };

        if (earlyWarnings.length > 0 && confirmedTrends.length > 0) {
            html += `<tr class="section-header"><td colspan="6">⚡ Early Warnings (Zero-Line Crosses)</td></tr>`;
            html += buildRows(earlyWarnings);
            html += `<tr class="section-header"><td colspan="6">🚀 Confirmed Trend Breakouts</td></tr>`;
            html += buildRows(confirmedTrends);
        } else {
            html += buildRows(filtered);
        }

        tbody.innerHTML = html;
    }
</script>

</body>
</html>
