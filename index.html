<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Monotonic Trend Consensus - Binance Futures Scanner</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: monospace; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #2a2a2a; }
        th { background-color: #1e1e1e; color: #ffffff; }
        .conviction-high { color: #00ffcc; font-weight: bold; }
        .conviction-med { color: #ffcc00; font-weight: bold; }
        .conviction-low { color: #ff4d4d; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Monotonic Trend Consensus - Binance Futures Scanner</h2>
    <div id="scanner-status">Evaluated: <span id="total-eval">0</span> | Passed Vol Filter (&gt; $5M): <span id="passed-vol">0</span></div>

    <table id="scanner-table">
        <thead>
            <tr>
                <th>SYMBOL</th>
                <th>STATE / SIGNAL</th>
                <th>STATUS</th>
                <th>4H TREND</th>
                <th>CVD FLOW</th>
                <th>CONVICTION</th>
            </tr>
        </thead>
        <tbody id="scanner-table-body">
            <!-- Rows injected dynamically -->
        </tbody>
    </table>

<script>
    // Mock dataset representing scanner feed items
    const rawScannerData = [
        { symbol: "ORCAUSDT", volume24h: 12500000, signalState: "Bullish", status: "CURRENT BAR (0)", ltfDirection: "Bullish", htfDirection: "Bullish", cvdDelta: 15400 },
        { symbol: "HOLOUSDT", volume24h: 8200000, signalState: "Bullish", status: "CURRENT BAR (0)", ltfDirection: "Bullish", htfDirection: "Neutral", cvdDelta: 5200 },
        { symbol: "FILUSDT", volume24h: 3100000, signalState: "Bearish", status: "CURRENT BAR (0)", ltfDirection: "Bearish", htfDirection: "Bearish", cvdDelta: -12000 }, // Will be filtered out (< $5M)
        { symbol: "OPENAIUSDT", volume24h: 45000000, signalState: "Bearish", status: "CURRENT BAR (0)", ltfDirection: "Bearish", htfDirection: "Bearish", cvdDelta: -88000 }
    ];

    function runScanner() {
        // 1. STRICT BACKEND VOLUME FILTER (> $5M minimum)
        const MIN_VOLUME = 5000000;
        const volumeFiltered = rawScannerData.filter(item => item.volume24h >= MIN_VOLUME);

        document.getElementById("total-eval").innerText = rawScannerData.length;
        document.getElementById("passed-vol").innerText = volumeFiltered.length;

        const tableBody = document.getElementById("scanner-table-body");
        tableBody.innerHTML = "";

        volumeFiltered.forEach(item => {
            const convictionData = calculateConviction(item);

            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${item.symbol}</td>
                <td>${item.signalState}</td>
                <td>${item.status}</td>
                <td>${item.htfDirection}</td>
                <td>${item.cvdDelta > 0 ? '+CVD' : '-CVD'}</td>
                <td class="${convictionData.class}">${convictionData.label}</td>
            `;
            tableBody.appendChild(row);
        });
    }

    // 2. UPDATED CONVICTION CALCULATION (Core triggers untouched; HTF & CVD feed ONLY into Conviction)
    function calculateConviction(item) {
        let convictionScore = 0;

        // Pillar 1: Base Signal / Trigger validation
        if (item.signalState === "Bullish" || item.signalState === "Bearish") {
            convictionScore += 1;
        }

        // Pillar 2: Multi-Timeframe Trend Alignment (HTF + LTF matching direction)
        if (item.ltfDirection === item.htfDirection) {
            convictionScore += 1;
        }

        // Pillar 3: CVD Confirmation (Taker volume backing the direction)
        if (item.signalState === "Bullish" && item.cvdDelta > 0) {
            convictionScore += 1;
        } else if (item.signalState === "Bearish" && item.cvdDelta < 0) {
            convictionScore += 1;
        }

        // Grading scale output
        if (convictionScore === 3) return { label: "HIGH 🟢", class: "conviction-high" };
        if (convictionScore === 2) return { label: "MEDIUM 🟡", class: "conviction-med" };
        return { label: "LOW 🔴", class: "conviction-low" };
    }

    // Initialize scanner render
    runScanner();
</script>

</body>
</html>
